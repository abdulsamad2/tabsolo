      <text x="18" y="100" fill="#fff" font-weight="600">Clear cookies on 4</text>

      <text x="18" y="130">Burn IP on 4</text>
      <text x="18" y="156">Clear &amp; New IP on 4</text>
      <text x="18" y="182">Open sign-in page on 4</text>
      <text x="18" y="208">Auto-Login on 4</text>
      <text x="300" y="208" text-anchor="end" fill="#6b7380" font-family="ui-monospace, monospace" font-size="11">⌘1</text>
      <text x="18" y="234">Autofill + submit on 4</text>
      <text x="300" y="234" text-anchor="end" fill="#6b7380" font-family="ui-monospace, monospace" font-size="11">⌘2</text>
