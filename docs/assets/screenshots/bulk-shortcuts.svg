    <circle cx="434" cy="16" r="6" fill="#026cdf"/>
    <text x="446" y="20" fill="#eef1f6" font-size="11" font-weight="600">shop · Limited Release</text>
    <rect x="568" y="8" width="38" height="16" fill="#5a7cff" rx="4"/>
    <text x="587" y="19" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">#4823</text>
    <!-- 4 selected -->
    <rect x="624" width="200" height="32" fill="#20283a" stroke="#5a7cff" stroke-width="2" rx="8"/>
    <circle cx="642" cy="16" r="6" fill="#026cdf"/>
    <text x="654" y="20" fill="#eef1f6" font-size="11" font-weight="600">shop · Limited Release</text>
