    <line x1="12" y1="398" x2="328" y2="398" stroke="#333a46"/>
    <text x="18" y="422" fill="#c91c1c" font-size="13">Close 4 tabs</text>
    <text x="300" y="422" text-anchor="end" fill="#6b7380" font-family="ui-monospace, monospace" font-size="11">⌘W</text>
    <text x="18" y="448" fill="#eef1f6" font-size="13">Deselect all</text>
    <text x="300" y="448" text-anchor="end" fill="#6b7380" font-family="ui-monospace, monospace" font-size="11">Esc</text>
