<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="30" stdDeviation="50" flood-opacity="0.5"/></filter>
  </defs>

  <!-- Background: dim app view -->
  <rect width="1200" height="800" fill="#0a0b0f" rx="14"/>
  <rect width="1200" height="800" fill="rgba(0,0,0,.5)" rx="14"/>
  <!-- Faint hint of tab strip -->
  <rect y="40" width="1200" height="56" fill="#141821" opacity="0.4"/>

  <!-- Playbooks modal -->
  <g transform="translate(240, 70)" filter="url(#shadow)">
    <rect width="720" height="660" fill="#141821" stroke="#2a303a" rx="14"/>

    <!-- Header -->
    <text x="30" y="42" fill="#eef1f6" font-size="20" font-weight="700">📜 Playbooks</text>
    <text x="30" y="66" fill="#a4acb8" font-size="13">Record a flow once. Replay against any order.</text>
    <text x="686" y="42" text-anchor="end" fill="#6b7380" font-size="22">×</text>
    <line x1="30" y1="86" x2="690" y2="86" stroke="#2a303a"/>

    <!-- Recording status -->
    <rect x="30" y="104" width="660" height="56" fill="rgba(201,28,28,0.08)" stroke="rgba(201,28,28,0.4)" rx="10"/>
    <circle cx="52" cy="132" r="7" fill="#c91c1c"/>
    <text x="68" y="128" fill="#eef1f6" font-size="13" font-weight="600">Recording in progress on tab #4821</text>
    <text x="68" y="146" fill="#a4acb8" font-size="12">14 steps captured · shop · Limited Release</text>
    <g transform="translate(566, 118)">
      <rect width="106" height="26" fill="#c91c1c" rx="6"/>
      <text x="53" y="18" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">⏹ Stop recording</text>
    </g>

    <!-- Replay inputs -->
    <text x="30" y="194" fill="#7f9bff" font-size="11" font-weight="700" letter-spacing="1.5">TARGET URL (OPTIONAL)</text>
    <rect x="30" y="206" width="660" height="38" fill="#0a0b0f" stroke="#2a303a" rx="8"/>
    <text x="46" y="230" fill="#eef1f6" font-size="12" font-family="ui-monospace, Menlo, monospace">https://shop.example.com/products/limited-release-01</text>

    <text x="30" y="276" fill="#7f9bff" font-size="11" font-weight="700" letter-spacing="1.5">JOB VARIABLES</text>
    <g font-size="12">
      <!-- Section -->
      <g transform="translate(30, 288)">
        <text y="12" fill="#6b7380" font-size="10">VARIANT</text>
        <rect y="18" width="120" height="36" fill="#0a0b0f" stroke="#2a303a" rx="8"/>
        <text x="14" y="42" fill="#eef1f6" font-weight="600">Black</text>
      </g>
      <g transform="translate(160, 288)">
        <text y="12" fill="#6b7380" font-size="10">SIZE</text>
        <rect y="18" width="80" height="36" fill="#0a0b0f" stroke="#2a303a" rx="8"/>
        <text x="14" y="42" fill="#eef1f6" font-weight="600">10</text>
      </g>
      <g transform="translate(250, 288)">
        <text y="12" fill="#6b7380" font-size="10">LOW IDX</text>
        <rect y="18" width="100" height="36" fill="#0a0b0f" stroke="#2a303a" rx="8"/>
        <text x="14" y="42" fill="#eef1f6" font-weight="600">7</text>
      </g>
      <g transform="translate(360, 288)">
        <text y="12" fill="#6b7380" font-size="10">HIGH IDX</text>
        <rect y="18" width="100" height="36" fill="#0a0b0f" stroke="#2a303a" rx="8"/>
        <text x="14" y="42" fill="#eef1f6" font-weight="600">10</text>
      </g>
      <g transform="translate(470, 288)">
        <text y="12" fill="#6b7380" font-size="10">QUANTITY</text>
        <rect y="18" width="80" height="36" fill="#0a0b0f" stroke="#2a303a" rx="8"/>
        <text x="14" y="42" fill="#eef1f6" font-weight="600">4</text>
      </g>
      <g transform="translate(560, 288)">
        <text y="12" fill="#6b7380" font-size="10">&nbsp;</text>
        <rect y="18" width="130" height="36" fill="#5a7cff" rx="8"/>
        <text x="65" y="42" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">▶ Run on current tab</text>
      </g>
    </g>

    <!-- Saved playbooks list -->
    <text x="30" y="382" fill="#7f9bff" font-size="11" font-weight="700" letter-spacing="1.5">SAVED PLAYBOOKS · 6</text>
    <g font-size="13">
      <!-- Item 1 -->
      <g transform="translate(30, 394)">
        <rect width="660" height="52" fill="#1b212b" rx="10"/>
        <circle cx="22" cy="26" r="12" fill="#20283a"/>
        <text x="22" y="31" text-anchor="middle" fill="#5a7cff" font-size="14">▶</text>
        <text x="46" y="24" fill="#eef1f6" font-weight="600">Store A — fast cart</text>
        <text x="46" y="40" fill="#a4acb8" font-size="11">32 steps · last used 12m ago · 24 runs</text>
        <g transform="translate(488, 14)">
          <rect width="60" height="26" fill="#5a7cff" rx="6"/>
          <text x="30" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">▶ Run</text>
          <rect x="68" width="60" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="98" y="18" text-anchor="middle" fill="#a4acb8" font-size="11">Rename</text>
          <rect x="136" width="26" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="149" y="19" text-anchor="middle" fill="#a4acb8" font-size="12">🗑</text>
        </g>
      </g>
      <!-- Item 2 -->
      <g transform="translate(30, 456)">
        <rect width="660" height="52" fill="#1b212b" rx="10"/>
        <circle cx="22" cy="26" r="12" fill="#20283a"/>
        <text x="22" y="31" text-anchor="middle" fill="#5a7cff" font-size="14">▶</text>
        <text x="46" y="24" fill="#eef1f6" font-weight="600">Store B — bulk listing</text>
        <text x="46" y="40" fill="#a4acb8" font-size="11">28 steps · last used 1h ago · 9 runs</text>
        <g transform="translate(488, 14)">
          <rect width="60" height="26" fill="#5a7cff" rx="6"/>
          <text x="30" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">▶ Run</text>
          <rect x="68" width="60" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="98" y="18" text-anchor="middle" fill="#a4acb8" font-size="11">Rename</text>
          <rect x="136" width="26" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="149" y="19" text-anchor="middle" fill="#a4acb8" font-size="12">🗑</text>
        </g>
      </g>
      <!-- Item 3 -->
      <g transform="translate(30, 518)">
        <rect width="660" height="52" fill="#1b212b" rx="10"/>
        <circle cx="22" cy="26" r="12" fill="#20283a"/>
        <text x="22" y="31" text-anchor="middle" fill="#5a7cff" font-size="14">▶</text>
        <text x="46" y="24" fill="#eef1f6" font-weight="600">Store C — mobile checkout</text>
        <text x="46" y="40" fill="#a4acb8" font-size="11">22 steps · last used yesterday · 17 runs</text>
        <g transform="translate(488, 14)">
          <rect width="60" height="26" fill="#5a7cff" rx="6"/>
          <text x="30" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">▶ Run</text>
          <rect x="68" width="60" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="98" y="18" text-anchor="middle" fill="#a4acb8" font-size="11">Rename</text>
          <rect x="136" width="26" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="149" y="19" text-anchor="middle" fill="#a4acb8" font-size="12">🗑</text>
        </g>
      </g>
      <!-- Item 4 -->
      <g transform="translate(30, 580)">
        <rect width="660" height="52" fill="#1b212b" rx="10"/>
        <circle cx="22" cy="26" r="12" fill="#20283a"/>
        <text x="22" y="31" text-anchor="middle" fill="#5a7cff" font-size="14">▶</text>
        <text x="46" y="24" fill="#eef1f6" font-weight="600">Store D — product research</text>
        <text x="46" y="40" fill="#a4acb8" font-size="11">18 steps · last used 2d ago · 6 runs</text>
        <g transform="translate(488, 14)">
          <rect width="60" height="26" fill="#5a7cff" rx="6"/>
          <text x="30" y="18" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">▶ Run</text>
          <rect x="68" width="60" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="98" y="18" text-anchor="middle" fill="#a4acb8" font-size="11">Rename</text>
          <rect x="136" width="26" height="26" fill="#1b212b" stroke="#333a46" rx="6"/>
          <text x="149" y="19" text-anchor="middle" fill="#a4acb8" font-size="12">🗑</text>
        </g>
      </g>
    </g>
  </g>
</svg>
