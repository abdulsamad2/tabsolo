<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
  <rect width="1200" height="600" fill="#0a0b0f" rx="14"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#febc2e"/>
  <circle cx="68" cy="22" r="6" fill="#28c840"/>

  <!-- Tab strip zoomed in -->
  <rect x="0" y="60" width="1200" height="80" fill="#0d1017"/>

  <!-- Group chip RED Taylor -->
  <g transform="translate(16, 80)">
    <rect width="118" height="40" fill="#c91c1c" rx="10"/>
    <circle cx="14" cy="20" r="5" fill="#fff"/>
    <text x="26" y="25" fill="#fff" font-size="12" font-weight="700">TM · Taylor</text>
  </g>
  <!-- Selected tab -->
  <g transform="translate(144, 80)">
    <rect width="200" height="40" fill="#20283a" stroke="#5a7cff" stroke-width="2" rx="10"/>
    <circle cx="22" cy="20" r="7" fill="#026cdf"/>
    <text x="38" y="25" fill="#eef1f6" font-size="12" font-weight="600">tm · Taylor Swift NYC</text>
    <rect x="150" y="12" width="40" height="18" fill="#5a7cff" rx="5"/>
    <text x="170" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">#4821</text>
  </g>
  <!-- Selected tab 2 -->
  <g transform="translate(354, 80)">
    <rect width="200" height="40" fill="#20283a" stroke="#5a7cff" stroke-width="2" rx="10"/>
    <circle cx="22" cy="20" r="7" fill="#026cdf"/>
    <text x="38" y="25" fill="#eef1f6" font-size="12" font-weight="600">tm · Taylor Swift NYC</text>
    <rect x="150" y="12" width="40" height="18" fill="#5a7cff" rx="5"/>
    <text x="170" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">#4822</text>
  </g>
  <!-- Group chip BLUE AXS -->
  <g transform="translate(564, 80)">
    <rect width="130" height="40" fill="#0d6efd" rx="10"/>
    <circle cx="14" cy="20" r="5" fill="#fff"/>
    <text x="26" y="25" fill="#fff" font-size="12" font-weight="700">AXS · Beyoncé</text>
  </g>
  <!-- Selected tab 3 -->
  <g transform="translate(704, 80)">
    <rect width="200" height="40" fill="#20283a" stroke="#5a7cff" stroke-width="2" rx="10"/>
    <circle cx="22" cy="20" r="7" fill="#ff5a5a"/>
    <text x="38" y="25" fill="#eef1f6" font-size="12" font-weight="600">axs · Cowboy Carter LA</text>
  </g>
  <!-- Normal tab -->
  <g transform="translate(914, 80)">
    <rect width="200" height="40" fill="#141821" stroke="#2a303a" rx="10"/>
    <circle cx="22" cy="20" r="7" fill="#15803d"/>
    <text x="38" y="25" fill="#a4acb8" font-size="12">sg · Oasis Wembley '26</text>
  </g>

  <!-- Right-click context menu overlay -->
  <g transform="translate(380, 150)" filter="drop-shadow(0 10px 30px rgba(0,0,0,.6))">
    <rect width="320" height="366" fill="#1b212b" stroke="#333a46" rx="10"/>
    <!-- Bulk header -->
    <text x="16" y="26" fill="#7f9bff" font-size="11" font-weight="700" letter-spacing="1.5">3 TABS SELECTED</text>
    <line x1="12" y1="38" x2="308" y2="38" stroke="#333a46"/>
    <g font-size="13" fill="#eef1f6">
      <!-- hover -->
      <rect x="4" y="46" width="312" height="30" fill="#20283a" rx="6"/>
      <text x="16" y="66" fill="#fff">Group 3 tabs…</text>
      <text x="16" y="98">Clear cookies on 3</text>
      <text x="16" y="128">Burn IP on 3</text>
      <text x="16" y="158">Clear &amp; New IP on 3</text>
      <text x="16" y="188">Open sign-in page on 3</text>
      <text x="16" y="218">Auto-Login on 3</text>
      <text x="200" y="218" fill="#6b7380" font-family="ui-monospace, monospace" font-size="11">⌘1</text>
      <text x="16" y="248">Go Home on 3</text>
      <text x="200" y="248" fill="#6b7380" font-family="ui-monospace, monospace" font-size="11">⌘3</text>
    </g>
    <line x1="12" y1="268" x2="308" y2="268" stroke="#333a46"/>
    <g font-size="13" fill="#eef1f6">
      <text x="16" y="290">Reload</text>
      <text x="16" y="320" fill="#c91c1c">Close 3 tabs</text>
    </g>
  </g>

  <!-- Caption -->
  <text x="600" y="560" text-anchor="middle" fill="#6b7380" font-size="13">
    Shift-click to select a range · ⌘-click to toggle · right-click any to act on all
  </text>
</svg>
